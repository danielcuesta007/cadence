# Runs the Rust test suite on every pull request and on pushes to dev/main.
# Tests that need the (gitignored) Whisper model skip themselves when it is absent.
name: tests
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  # macOS runners are scarce: on 3 Nov 2026 a docs-only PR (#104) was cancelled four times
  # with "The job was not acquired by Runner of type hosted". This cheap Linux job decides
  # whether a pull request touches anything besides docs/; if not, the macOS jobs skip.
  # Pushes to dev and main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -qv '^docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  cargo-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --locked
      - run: cargo build --release -p cadence-ffi --locked
      - run: swift build --package-path platform-macos -c release
      - run: platform-macos/.build/release/cadence selftest-hotkeys
      - run: platform-macos/.build/release/cadence selftest-delivery
      - run: platform-macos/.build/release/cadence selftest-capture
      - run: platform-macos/.build/release/insertctl selftest
  site-and-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd site && npm run build && npm test
      - run: python3 -B -m unittest qa.test_make_dmg qa.test_noise qa.test_whisper_cache_guard
